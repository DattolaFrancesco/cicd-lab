name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip
      - run:  pip install -r requirement.txt
      - run: python -m pytest -v
docker:
  needs: test
  runs-on: ubuntu-latest
  steps:
    - uses: actions/checkout@v4
    - run: docker compose up -d --build
    - run: curl -f --retry 10 --retry-connrefused --retry-delay 2 http://localhost/health
    - if: always()
      run: docker compose logs